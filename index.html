<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ABC School - Student Fee Management</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#071719;
 color:#eefafa;
}

.header{
 padding:22px 30px;
 background:linear-gradient(135deg,#07191b,#123538);
 border-bottom:1px solid #24565a;
}

.header-inner{
 max-width:1500px;
 margin:auto;
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.brand{
 display:flex;
 align-items:center;
 gap:15px;
}

.logo{
 width:60px;
 height:60px;
 border-radius:16px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:23px;
 font-weight:900;
 background:linear-gradient(135deg,#55e7cf,#159c8b);
 box-shadow:0 0 28px rgba(40,230,200,.25);
}

h1{margin:0;font-size:27px}
.brand p{margin:5px 0;color:#8ba8aa;font-size:11px}

.ai{
 padding:10px 16px;
 border-radius:25px;
 border:1px solid #1a8f80;
 color:#55e8ce;
 background:rgba(30,200,170,.08);
 font-size:10px;
 font-weight:bold;
}

.container{
 max-width:1500px;
 margin:auto;
 padding:24px;
}

.top{
 display:flex;
 justify-content:space-between;
 align-items:end;
 margin-bottom:18px;
}

.control{width:230px}

label{
 display:block;
 color:#8da8aa;
 font-size:10px;
 font-weight:bold;
 margin-bottom:6px;
}

input,select,textarea{
 width:100%;
 padding:11px;
 border-radius:8px;
 border:1px solid #315457;
 background:#102628;
 color:white;
 outline:none;
}

button{
 border:0;
 border-radius:9px;
 padding:11px 15px;
 cursor:pointer;
 font-weight:bold;
 font-size:10px;
 transition:.2s;
}

button:hover{
 transform:translateY(-1px);
 filter:brightness(1.12);
}

.add{
 background:linear-gradient(135deg,#22d5b5,#078476);
 color:white;
 box-shadow:0 0 16px rgba(30,220,180,.18);
}

.receiptBtn{
 background:linear-gradient(135deg,#12bfa8,#08776e);
 color:white;
}

.paymentBtn{
 background:linear-gradient(135deg,#e8c354,#a98626);
 color:#14201f;
}

.whatsapp{
 background:#187c68;
 color:white;
}

.delete{
 background:#8e3543;
 color:white;
}

.monthlyBtn{
 background:linear-gradient(135deg,#e9c75c,#b08a26);
 color:#18201e;
 padding:12px 18px;
}

.months{
 display:flex;
 gap:9px;
 overflow-x:auto;
 padding-bottom:18px;
}

.month{
 min-width:95px;
 text-align:center;
 padding:11px 16px;
 border-radius:25px;
 background:linear-gradient(135deg,#1a3740,#244b58);
 border:1px solid #315d68;
 color:#a9c1c4;
 cursor:pointer;
 font-size:11px;
}

.month.active{
 color:white;
 background:linear-gradient(135deg,#14d5d1,#19b98d);
 border-color:#35eee0;
 box-shadow:0 0 22px rgba(25,220,190,.35);
}

.dashboard{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:14px;
}

.card{
 padding:20px;
 border-radius:15px;
 background:linear-gradient(145deg,#12323d,#0c2227);
 border:1px solid #244d55;
 box-shadow:inset 0 0 30px rgba(30,170,200,.04);
}

.card:nth-child(1){border-left:3px solid #39cfff}
.card:nth-child(2){border-left:3px solid #22d5ad}
.card:nth-child(3){border-left:3px solid #e2bd50}
.card:nth-child(4){border-left:3px solid #ed6464}

.card-title{
 color:#8da8aa;
 font-size:10px;
 font-weight:bold;
}

.number{
 font-size:30px;
 font-weight:900;
 margin-top:9px;
}

.sub{
 color:#668285;
 font-size:9px;
 margin-top:5px;
}

.money{
 margin:15px 0 20px;
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:12px;
}

.moneyBox{
 padding:16px;
 border-radius:12px;
 background:#0d2226;
 border:1px solid #24454b;
}

.moneyBox span{
 display:block;
 color:#789396;
 font-size:9px;
 margin-bottom:7px;
}

.moneyBox strong{font-size:19px}

.section{
 margin-bottom:20px;
 padding:19px;
 border-radius:15px;
 background:#0b2023;
 border:1px solid #234348;
}

.sectionHead{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:15px;
 margin-bottom:16px;
}

.sectionHead h2{
 margin:0 0 5px;
 font-size:18px;
}

.sectionHead p{
 margin:0;
 color:#718c8e;
 font-size:10px;
}

.tableWrap{overflow-x:auto}

table{
 width:100%;
 border-collapse:collapse;
 min-width:1450px;
}

th{
 padding:12px 8px;
 background:#122c31;
 color:#8fa9ab;
 font-size:9px;
 text-align:left;
}

td{
 padding:10px 8px;
 border-bottom:1px solid #1d383c;
 font-size:10px;
 white-space:nowrap;
}

.photo{
 width:48px;
 height:48px;
 border-radius:9px;
 object-fit:cover;
 border:1px solid #42676b;
}

.status{
 padding:5px 9px;
 border-radius:20px;
 font-size:8px;
 font-weight:bold;
}

.paid{background:#123d36;color:#55e2bf}
.due{background:#443a19;color:#e6c65b}
.overdue{background:#491e25;color:#ff7777}

.modal{
 display:none;
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.82);
 z-index:1000;
 overflow:auto;
}

.modalBox{
 width:94%;
 max-width:1000px;
 margin:30px auto;
 background:#0c2023;
 border:1px solid #31565a;
 border-radius:16px;
 padding:22px;
}

.modalHead{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:18px;
}

.close{
 cursor:pointer;
 font-size:27px;
 color:#8fa7a9;
}

.formGrid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:13px;
}

.full{grid-column:1/-1}

.preview{
 display:none;
 width:100px;
 height:100px;
 object-fit:cover;
 border-radius:10px;
 margin-top:8px;
 border:2px solid #1fd6ba;
}

/* RECEIPT */

.receipt{
 background:white;
 color:#182b2d;
}

.receiptTop{
 padding:22px;
 background:linear-gradient(135deg,#073d3d,#08796f);
 color:white;
 display:flex;
 justify-content:space-between;
}

.receiptTop h2{margin:0}
.receiptTop p{font-size:10px}

.voucher{
 text-align:right;
}

.voucher strong{
 display:block;
 font-size:18px;
}

.receiptBody{padding:24px}

.studentInfo{
 display:flex;
 gap:18px;
 align-items:center;
 border-bottom:1px solid #d7e0e0;
 padding-bottom:18px;
}

.studentInfo img{
 width:100px;
 height:100px;
 object-fit:cover;
 border-radius:10px;
}

.studentInfo h3{margin:0 0 7px}

.studentInfo p{
 margin:4px 0;
 font-size:10px;
 color:#617273;
}

.receiptTable{
 width:100%;
 min-width:0;
 border-collapse:collapse;
 margin-top:20px;
}

.receiptTable td{
 border:1px solid #ccd7d7;
 padding:9px;
 white-space:normal;
}

.receiptTable td:first-child{
 width:35%;
 background:#eef4f4;
 font-weight:bold;
}

.amountBox{
 margin-top:18px;
 padding:15px;
 display:flex;
 justify-content:space-between;
 background:#e9f7f3;
 border:1px solid #c9e7df;
 border-radius:9px;
}

.amountBox strong{
 color:#08796f;
 font-size:25px;
}

.signatures{
 display:flex;
 justify-content:space-between;
 margin-top:60px;
 font-size:9px;
 color:#657
